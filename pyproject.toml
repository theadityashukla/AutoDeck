[project]
name = "autodeck"
version = "2.0.0.dev0"
description = "Accuracy-first generation of consulting deliverables as native, editable PPTX"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "fonttools>=4.51",
    "pillow>=10.3",
    # One HTTP transport for all three providers rather than three vendor SDKs — see
    # decision B14. Keeps the on-the-wire schema dialect, the backoff policy, and the
    # mocked-transport tests uniform across providers.
    "httpx>=0.27",
    "docling>=2.117.0",
]

[project.scripts]
autodeck = "autodeck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autodeck"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 96
target-version = "py311"
# `legacy/` is frozen (B2). Markdown is excluded because ruff formats Python code blocks
# inside .md files, and `docs/AUTODECK_V2_PLAN.md` is a vendored spec — reformatting the
# sketch in §6.1 would rewrite the document this build is implementing against.
extend-exclude = ["legacy", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# The lookalike-substitution table is a map *from* ambiguous Unicode; flagging the very
# characters it exists to normalise would make the rule unusable exactly where it applies.
"autodeck/ingest/provenance.py" = ["RUF001"]
# Its fixtures contain the ligatures, curly quotes and thin spaces the matcher exists to
# tolerate; the characters are the test.
"tests/test_ingest.py" = ["B011", "RUF001"]
# The A2 normalisation table is a map *from* the ambiguous characters — the multiplication
# sign, the en dash in a range, the four space-like thousands separators. Flagging them is
# the same mistake as flagging them in provenance.py: the rule fires exactly where the
# module's subject matter lives.
"autodeck/audit/numeric_linter.py" = ["RUF001", "RUF002"]
"tests/test_numeric_linter.py" = ["B011", "RUF001", "RUF002"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["autodeck", "tests"]
exclude = ["legacy", "**/__pycache__", "runs", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
# docling_core.types.doc is docling's documented public API, but its __init__ re-exports
# without `__all__`, which trips pyright's strict re-export rule. That is the library's
# packaging hygiene, not ours, and the alternative — importing from private submodule
# paths — would couple us to internals that really can move.
reportPrivateImportUsage = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` and `render` are deselected by default: CI has no API keys and, per B10, no
# LibreOffice or font stack. Run them locally with `-m live` / `-m render`.
addopts = "-m 'not live and not render'"
markers = [
    "live: hits a real provider API; needs credentials, costs money, skipped in CI",
    "render: needs headless LibreOffice and installed fonts; local-only per B10",
]
