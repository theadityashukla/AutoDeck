# AutoDeck studio (v3) model bindings: docs/AUTODECK_V3_PLAN.md §6, docs/phases/V3-PHASE-1.md.
#
# The studio's own bindings, separate from v2's config/models.yaml (which binds v2's
# pipeline roles and is not read by the studio). Phase 1 has one role, `lead`, which does
# every layer: there is no routing yet (plan §12 Phase 1). Phase 2 adds one role per layer.
#
# The model ids are the ones config/models.yaml already pins for the same environments,
# never recalled from memory (B15, B23): dev-mistral uses the model v2 binds to its
# conversational tool-calling roles (composer, advisor); sit and prod use the model v2
# binds to its direction roles (planner, outline), the lead tier of plan §6.1.
#
# The sit/prod Claude ids are unverified against a live API, as config/models.yaml says.
#
# `tokens` is the design-token file the studio renders and checks layouts with until the
# design system (Phase 3) decides them. Its fonts must be installed (dev.json uses Carlito,
# installed by scripts/install-dev-fonts.sh).

default_env: dev-mistral
tokens: config/tokens/dev.json

environments:
  dev-mistral:
    lead: {provider: mistral, model: ministral-14b-2512}
  # First live run against OpenAI: `gpt-5.4-mini`, the id exactly as the models listing
  # returns it (a current mid-tier tool-calling chat model). Needs OPENAI_API_KEY.
  dev-openai:
    lead: {provider: openai, model: gpt-5.4-mini}
  sit:
    lead: {provider: claude, model: claude-opus-5}
  prod:
    lead: {provider: claude, model: claude-opus-5}
