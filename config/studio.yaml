# AutoDeck studio (v3) model bindings: docs/AUTODECK_V3_PLAN.md §6,
# docs/phases/V3-PHASE-1.md, docs/phases/V3-PHASE-2-3.md.
#
# The studio's own bindings, separate from v2's config/models.yaml (which binds v2's
# pipeline roles and is not read by the studio). Phase 2-3 binds one role per layer:
#
#   lead      L1 Direction: what each slide must prove and what goes on it, in words
#   system    L2 System: turns a design concept into a checked palette and roles
#   designer  L3 Composition (and L4 Placement in this phase): one slide from its brief
#   mechanic  L5 Mechanics: small local edits, without the lead
#   router    decides whether a message is a small edit (mechanic) or needs the lead
#   reviewer  reserved, unused in this phase (may be left out)
#
# Each binding may set `reasoning` (none | low | medium | high | xhigh; sent only on the
# Responses endpoint), `max_output_tokens`, and `api` (auto | chat | responses). With
# `auto`, OpenAI model ids starting with gpt-5.6 use the Responses endpoint (they reject
# tools with reasoning on Chat Completions), everything else v2's provider.
#
# Model ids are never recalled from memory (B15, B23): every id here already appears in
# config/models.yaml or bench/slides/prices.yaml. Environments with one model bind it to
# every role; tiering only means something where the tiers differ (plan §6.5).
#
# `tokens` is the base design-token file: fonts, sizes and spacing for every deck, and the
# palette of the provisional default design system. A design system replaces the palette
# only. Its fonts must be installed (dev.json uses Carlito, scripts/install-dev-fonts.sh).

default_env: dev-mistral
tokens: config/tokens/dev.json

environments:
  dev-mistral:
    lead: {provider: mistral, model: ministral-14b-2512}
    system: {provider: mistral, model: ministral-14b-2512}
    designer: {provider: mistral, model: ministral-14b-2512}
    mechanic: {provider: mistral, model: ministral-14b-2512}
    router: {provider: mistral, model: ministral-14b-2512}
  # Provisional tiering from the slide bench (bench/slides/results/README.md): Luna designed
  # 14 of 16 slides clean in 2-4 attempts at about a fifth of Sol's cost; gpt-5.4-mini could
  # not pass layout QA with the same brief, so it only routes and makes small edits.
  # Needs OPENAI_API_KEY.
  dev-openai:
    lead: {provider: openai, model: gpt-5.6-terra, reasoning: medium, max_output_tokens: 16000}
    system: {provider: openai, model: gpt-5.6-terra, reasoning: low, max_output_tokens: 8000}
    designer: {provider: openai, model: gpt-5.6-luna, reasoning: medium, max_output_tokens: 32000}
    mechanic: {provider: openai, model: gpt-5.4-mini, max_output_tokens: 4000}
    router: {provider: openai, model: gpt-5.4-mini, max_output_tokens: 1000}
  # The sit/prod Claude id is unverified against a live API, as config/models.yaml says.
  sit:
    lead: {provider: claude, model: claude-opus-5}
    system: {provider: claude, model: claude-opus-5}
    designer: {provider: claude, model: claude-opus-5}
    mechanic: {provider: claude, model: claude-opus-5}
    router: {provider: claude, model: claude-opus-5}
  prod:
    lead: {provider: claude, model: claude-opus-5}
    system: {provider: claude, model: claude-opus-5}
    designer: {provider: claude, model: claude-opus-5}
    mechanic: {provider: claude, model: claude-opus-5}
    router: {provider: claude, model: claude-opus-5}
