# Assumed prices, US dollars per million tokens, used only by the bench's budget guard and
# cost estimates (bench/slides/run.py).
#
# THESE ARE DELIBERATELY HIGH ASSUMPTIONS, NOT CONFIRMED PRICES. They are set above what the
# models are expected to cost so that the estimated spend errs on the side of stopping early.
# Replace them with the real price list before reading any cost number as an invoice.
#
# Image inputs are billed as input tokens, and reasoning tokens are part of the completion
# count the API reports (`completion_tokens`), so one input rate and one output rate cover
# everything. A model missing from this file is refused unless --allow-unpriced is given.
models:
  "openai:gpt-5.4-mini":
    input: 3
    output: 15
  "openai:gpt-5.6-luna":
    input: 5
    output: 25
  "openai:gpt-5.6-terra":
    input: 12
    output: 60
  "openai:gpt-5.6-sol":
    input: 25
    output: 125
